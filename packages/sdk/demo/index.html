<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA Recorder - Demo</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #e53e3e; }
    .section { margin: 32px 0; padding: 20px; border: 1px solid #e2e8f0; border-radius: 8px; }
    button {
      padding: 8px 16px; margin: 4px; border: none; border-radius: 6px;
      cursor: pointer; background: #4a5568; color: white; font-size: 14px;
    }
    button:hover { background: #2d3748; }
    pre {
      background: #f7fafc; padding: 12px; border-radius: 6px;
      overflow: auto; max-height: 300px; font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>QA Recorder Demo</h1>
  <p>우측 하단의 빨간 버튼이 QA Recorder입니다. 클릭하면 저장 확인 팝업이 나타나고, 확인 시 <code>.webm</code> + <code>.har</code> 파일이 다운로드됩니다.</p>

  <div class="section">
    <h2>네트워크 요청 발생시키기</h2>
    <p>아래 버튼으로 네트워크 요청을 발생시킨 후 QA Recorder 버튼을 눌러보세요.</p>
    <button onclick="fetchTest()">fetch() 테스트</button>
    <button onclick="xhrTest()">XHR 테스트</button>
    <button onclick="fetchError()">fetch() 에러 테스트</button>
    <pre id="log-output">요청 버튼을 클릭하세요...</pre>
  </div>

  <div class="section">
    <h2>캡처된 네트워크 버퍼 확인</h2>
    <button onclick="showBuffer()">현재 버퍼 보기</button>
    <pre id="buffer-output">버튼을 눌러 확인하세요.</pre>
  </div>

  <script type="module">
    import { QARecorder } from '../src/index.ts';

    const recorder = new QARecorder({
      maxRequests: 100,
      maskHeaders: ['Authorization', 'Cookie'],
    });
    window.__recorder = recorder;

    await recorder.init();

    window.fetchTest = async () => {
      const log = document.getElementById('log-output');
      try {
        const res = await fetch('https://jsonplaceholder.typicode.com/posts/1');
        const data = await res.json();
        log.textContent = '[fetch] GET /posts/1\n' + JSON.stringify(data, null, 2);
      } catch (e) {
        log.textContent = '[fetch] 에러: ' + e.message;
      }
    };

    window.xhrTest = () => {
      const log = document.getElementById('log-output');
      const xhr = new XMLHttpRequest();
      xhr.open('POST', 'https://jsonplaceholder.typicode.com/posts');
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onload = () => {
        log.textContent = '[XHR] POST /posts\n' + xhr.responseText;
      };
      xhr.send(JSON.stringify({ title: 'test', body: 'hello', userId: 1 }));
    };

    window.fetchError = async () => {
      const log = document.getElementById('log-output');
      try {
        await fetch('https://jsonplaceholder.typicode.com/nonexistent/999');
        log.textContent = '[fetch] 404 응답 (캡처됨)';
      } catch (e) {
        log.textContent = '[fetch] 에러: ' + e.message;
      }
    };

    window.showBuffer = () => {
      const entries = recorder.getNetworkEntries();
      document.getElementById('buffer-output').textContent =
        `총 ${entries.length}건\n\n` +
        entries.map((e, i) =>
          `[${i + 1}] ${e.request.method} ${e.request.url}\n    → ${e.response.status} (${Math.round(e.time)}ms)`
        ).join('\n');
    };
  </script>
</body>
</html>
