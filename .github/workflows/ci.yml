name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # sdk의 타입 검사가 @qa-recorder/shared의 dist 타입을 참조하므로 먼저 빌드한다
      - name: Build shared types
        run: pnpm -F @qa-recorder/shared build

      - name: Typecheck
        run: pnpm -F qa-recorder typecheck

      - name: Test
        run: pnpm -F qa-recorder test

      - name: Build
        run: pnpm -F qa-recorder build
