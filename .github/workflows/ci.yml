name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build, package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -F qa-recorder typecheck

      - name: Test
        run: pnpm -F qa-recorder test

      - name: Build
        run: pnpm -F qa-recorder build

      # 패키징한 SDK를 저장소 밖의 독립 프로젝트에 설치해 skipLibCheck 없이 타입 검사하고,
      # tarball에 LICENSE·README·타입이 들어 있는지, 런타임 의존성·workspace 참조가 없는지 확인한다
      - name: Verify packed package in a standalone consumer
        run: pnpm -F qa-recorder verify:package

  e2e:
    # 브라우저마다 job을 나눈다. Chromium job 이름은 예전과 같다 (필수 체크 설정이 있으면 그대로 맞는다)
    name: Browser E2E (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            label: Chromium
          - browser: firefox
            label: Firefox
          - browser: webkit
            label: WebKit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # E2E는 현재 체크아웃에서 빌드한 dist/를 로컬 fixture 서버로 서빙한다
      - name: Build
        run: pnpm -F qa-recorder build

      - name: Install ${{ matrix.label }}
        run: pnpm -F qa-recorder exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E
        run: pnpm -F qa-recorder test:e2e --project=${{ matrix.browser }}
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: packages/sdk/playwright-report
          retention-days: 7
